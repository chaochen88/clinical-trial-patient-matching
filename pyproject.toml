[project]
name = "clinical-trial-patient-matching"
version = "0.1.0"
description = "A machine learning pipeline for matching patient profiles to active clinical trials."
authors = [{name = "Chao Chen", email = "chaochen@ADMINIS-JONLPTC.local"}]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "psycopg2-binary",
    "sqlalchemy",
    "python-dotenv",
    "pydantic>=2.10,<3",
    "langgraph>=1,<2",
    "langchain-anthropic>=1,<2",
    "rank-bm25>=0.2.2,<0.3",
    "sentence-transformers>=3,<6",
    "google-cloud-bigquery>=3.46.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Pixi Configuration Integration ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
pre-commit = ">=3.5.0"
ruff = ">=0.1.0"
pytest = ">=7.0.0"
openai = ">=3.19.0,<4"
anthropic = ">=0.49,<1"
duckdb = ">=1.5.6,<2"

# Automatically makes your src/ package editable inside your Pixi environment
[tool.pixi.pypi-dependencies]
clinical-trial-patient-matching = { path = ".", editable = true }
torch = { version = ">=2.6, <3", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.tasks]
# Testubg python
start = "python src/clinical_trial_patient_matching/main.py"
# Validation Gate (Linter + Formatter checks + Package validation)
check = "ruff check src/ && ruff format --check src/"
# Testing Gate
test = "pytest tests/"
# Hook Management
hooks-install = "pre-commit install"
anthropic-smoke = "python scripts/anthropic_smoke.py"
extract-demo = "python -m clinical_trial_patient_matching.extraction --demo"
extract-trial = "python -m clinical_trial_patient_matching.extraction"
patient-profiles = "python -m clinical_trial_patient_matching.patients"
patient-sources = "python scripts/prepare_class4.py"
mimic-profiles = "python -m clinical_trial_patient_matching.mimic_adapter"
retrieval-sources = "python scripts/prepare_class5.py"
retrieve-patients = "python -m clinical_trial_patient_matching.retrieval"
retrieval-engineering = "python scripts/evaluate_class5_engineering.py"

# --- Ruff Tooling Profiles ---
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
