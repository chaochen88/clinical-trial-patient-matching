[project]
name = "clinical-trial-patient-matching"
version = "0.1.0"
description = "A machine learning pipeline for matching patient profiles to active clinical trials."
authors = [{name = "Chao Chen", email = "chaochen@ADMINIS-JONLPTC.local"}]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "psycopg2-binary",
    "sqlalchemy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- Pixi Configuration Integration ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
pre-commit = ">=3.5.0"
ruff = ">=0.1.0"
pytest = ">=7.0.0"

# Automatically makes your src/ package editable inside your Pixi environment
[tool.pixi.pypi-dependencies]
clinical-trial-patient-matching = { path = ".", editable = true }

[tool.pixi.tasks]
# Testubg python
start = "python src/clinical_trial_patient_matching/main.py"
# Validation Gate (Linter + Formatter checks + Package validation)
check = "ruff check src/ && ruff format --check src/"
# Testing Gate
test = "pytest tests/"
# Hook Management
hooks-install = "pre-commit install"

# --- Ruff Tooling Profiles ---
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

