services:
  aact-postgres:
    image: postgres:16
    container_name: aact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aact
    ports:
      - "5432:5432"
    shm_size: "1gb"
    volumes:
      - aact-pgdata:/var/lib/postgresql/data
      - ./data/AACT/0706_dump:/dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aact"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  aact-pgdata:
